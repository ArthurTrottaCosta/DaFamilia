project_id = "dafamilia-local"
[api]
enabled = true
port = 57421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 57422
shadow_port = 57420
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[realtime]
enabled = true
[local_smtp]
enabled = true
port = 57424
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:5178"
additional_redirect_urls = ["http://127.0.0.1:5178/app", "http://localhost:5178/app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "Seu código do DaFamília"
content_path = "./supabase/templates/magic-link.html"
[auth.email.template.confirmation]
subject = "Seu código do DaFamília"
content_path = "./supabase/templates/magic-link.html"
[analytics]
enabled = false
[functions.notify]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
